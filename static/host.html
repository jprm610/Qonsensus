<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entangled Consensus · Host</title>
  <link rel="stylesheet" href="/static/style.css?v=i18n1">
</head>
<body class="host">
  <div id="conn" class="conn" hidden data-i18n="c.reconnecting">Reconnecting…</div>

  <header class="hbar">
    <div>
      <div class="titlerow">
        <h1>Entangled Consensus</h1>
        <div id="lang"></div>
      </div>
      <p class="muted" data-i18n="h.tagline">Leader elected with a |W⟩ state · votes counted with a |GHZ⟩ state</p>
    </div>
    <div class="actions">
      <div class="modepick">
        <span class="modelabel" id="election-label" data-i18n="h.electionLabel">Leader election</span>
        <div class="seg" id="election" role="radiogroup" aria-labelledby="election-label"
             data-i18n-title="h.electionTitle" title="How the leader is elected (can only be changed in the waiting room)">
          <button type="button" role="radio" data-mode="global">
            <span class="segt">Global ideal</span><span class="segs" data-i18n="h.globalSub">one shared |W⟩</span>
          </button>
          <button type="button" role="radio" data-mode="local">
            <span class="segt">Local · closing window</span><span class="segs" data-i18n="h.localSub">local copies + INTENT/ACK</span>
          </button>
        </div>
      </div>
      <label class="switch" id="noise-label">
        <input type="checkbox" id="noise" disabled> <span data-i18n="h.noise">Noise</span>
      </label>
      <button id="circuit-open" class="hbtn alt" data-i18n="h.circuit">Circuit</button>
      <button id="next" class="hbtn alt" disabled data-i18n="h.next">Next</button>
      <button id="newblock" class="hbtn" disabled data-i18n="h.newBlock">New block</button>
    </div>
  </header>

  <div class="hgrid">
    <section class="panel qrpanel">
      <h2 data-i18n="h.join">Scan to join</h2>
      <div id="qr" class="qrbox"></div>
      <div id="url" class="mono urlline"></div>
      <div id="count" class="bignum"></div>
      <p id="hint" class="muted hint"></p>
    </section>

    <section class="panel">
      <h2><span data-i18n="h.validators">Validators</span> <span id="vsub" class="muted"></span></h2>
      <div id="validators" class="vgrid"></div>
    </section>

    <section class="panel">
      <h2><span data-i18n="h.round">Round</span> <span id="phase" class="chip"></span></h2>
      <p id="phasemsg" class="phasemsg"></p>
      <p id="countdown" class="countdown big"></p>
      <div id="proposal" class="proposal" hidden></div>
      <div class="evidence">
        <div>
          <h3 id="wtitle">Election · |W⟩</h3>
          <div id="wbox" class="mono ev"></div>
        </div>
        <div>
          <h3 data-i18n="h.vote">Voting · |GHZ⟩</h3>
          <div id="gbox" class="mono ev"></div>
        </div>
      </div>
    </section>
  </div>

  <section class="panel chainpanel">
    <h2>
      <span data-i18n="h.chain">Chain</span> <span id="status"></span>
      <button id="repair" class="hbtn alt small" hidden data-i18n="h.repair" data-i18n-title="h.repairTitle">Repair</button>
      <span class="muted hint" data-i18n="h.chainHint">Click a block's content to tamper with it</span>
    </h2>
    <div id="chain" class="chain"></div>
  </section>

  <dialog id="circuit-dlg" class="circuit-dlg">
    <div class="dlg-bar">
      <h2><span data-i18n="h.circuit">Circuit</span> <span id="circuit-info" class="muted"></span></h2>
      <div class="actions">
        <button id="c-w" class="hbtn alt small" data-i18n="h.wElection">|W⟩ election</button>
        <button id="c-ghz" class="hbtn alt small" data-i18n="h.ghzVote">|GHZ⟩ vote</button>
        <button id="circuit-close" class="hbtn small" data-i18n="h.close">Close</button>
      </div>
    </div>
    <pre id="circuit" class="circuit mono"></pre>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/static/i18n.js?v=i18n1"></script>
  <script src="/static/host.js?v=i18n1"></script>
</body>
</html>
